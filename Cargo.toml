[package]
name = "crane-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Container registry client and registry server (Rust rewrite of a subset of go-containerregistry crane)"
publish = false

[lib]
name = "crane"
path = "src/lib.rs"

[[bin]]
name = "crane"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
ureq = { version = "3", default-features = false, features = ["rustls"] }

[target.'cfg(unix)'.dependencies]
# Already in the tree (ring, getrandom); used for SIGINT/SIGTERM in `registry serve`.
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
